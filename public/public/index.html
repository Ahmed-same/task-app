<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow - My Tasks</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ======= top bar ======= -->
  <header class="topbar">
    <h1 class="logo">Task<span>Flow</span></h1>

    <!-- each filter has its own color, the active one grows -->
    <nav class="filters">
      <button class="filter filter-all"       data-filter="all">All</button>
      <button class="filter filter-active"    data-filter="active">Active</button>
      <button class="filter filter-completed" data-filter="completed">Completed</button>
    </nav>
  </header>

  <main class="container">
    <!-- ======= add task form ======= -->
    <form id="add-form" class="add-form">
      <input id="title-input" type="text" placeholder="What do you need to do?" maxlength="200" required />

      <select id="category-input">
        <option value="General">General</option>
        <option value="Work">Work</option>
        <option value="Study">Study</option>
        <option value="Personal">Personal</option>
        <option value="Shopping">Shopping</option>
      </select>

      <input id="due-input" type="date" title="Due date (optional)" />

      <button type="submit" class="add-btn">+ Add</button>
    </form>

    <!-- error message (hidden unless the server rejects something) -->
    <p id="error-msg" class="error" hidden></p>

    <!-- ======= task list ======= -->
    <ul id="task-list" class="task-list"></ul>

    <!-- shown when there are no tasks for the current filter -->
    <p id="empty-msg" class="empty" hidden>No tasks here yet. Add one above!</p>
  </main>

  <!-- ======= footer counts ======= -->
  <footer class="stats">
    <span id="count-active">0 active</span>
    <span id="count-completed">0 completed</span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
